provider: "openai_compatible"
base_url: "${LEL_OPENAI_BASE_URL}"
api_key: "${LEL_OPENAI_API_KEY}"
model_name: "grok-4.5"
system_prompt: "Answer from existing knowledge only. Do not browse, search, call tools, inspect files, or describe future actions. The user is asking for historical domain recovery. Even if uncertain, provide one most likely historical registered domain. Put the domain on the first line, followed by at most two short sentences of justification. Never answer only with a plan such as I will search or I am checking."
benchmark_path: "../examples/benchmark.example.jsonl"
output_dir: "../outputs"
concurrency: 2
timeout_seconds: 120
max_retries: 2
retry_backoff_seconds: 1
resume: true
max_tokens:
temperature:
request_options:
